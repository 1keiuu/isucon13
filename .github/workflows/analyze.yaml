name: Log Analysis
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  analyze:
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, '/analyze') }}
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v3
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          name: id_rsa
          if_key_exists: replace
          known_hosts: unnecessary
          config: |
            Host isuconapp
              HostName ${{ secrets.APP_HOST_NAME }}
              User root
              Port 22
              StrictHostKeyChecking no
              IdentityFile ~/.ssh/id_rsa
            Host isucondb
              HostName ${{ secrets.DB_HOST_NAME }}
              User root
              Port 22
              StrictHostKeyChecking no
              IdentityFile ~/.ssh/id_rsa
      - name: Analyze
        run: |
          ssh isucondb 'make mysql/pt-query-digest'
          ssh isucondb 'make mysql/mysqldumpslow'
          ssh isuconapp 'make nginx/alp'
      - name: Pull analysis result
        run: |
          rsync -av isucondb:~/pt_query_digest_analysis.txt ./
          rsync -av isucondb:~/mysqldumpslow_analysis.txt ./
          rsync -av isuconapp:~/alp_analysis.txt ./
      - name: Create analysis comments on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const MAX_BODY_LENGTH = 60000;

            function buildCommentBody(title, content) {
              const prefix = `${title}\n<details>\n<summary>Show Output</summary>\n\n\`\`\`\n`;
              const suffix = '\n```\n\n</details>';
              const maxContentLength = MAX_BODY_LENGTH - prefix.length - suffix.length - 100;
              if (content.length <= maxContentLength) {
                return prefix + content + suffix;
              }
              const truncated = content.slice(0, maxContentLength);
              const note = `\n\n...(truncated: showing first ${maxContentLength} of ${content.length} characters)`;
              return prefix + truncated + note + suffix;
            }

            const reports = [
              {
                title: 'Analyze slow query log by pt-query-digest.',
                filepath: 'pt_query_digest_analysis.txt',
              },
              {
                title: 'Analyze slow query log by mysqldumpslow.',
                filepath: 'mysqldumpslow_analysis.txt',
              },
              {
                title: 'Analyze access log by alp.',
                filepath: 'alp_analysis.txt',
              },
            ];

            for (const report of reports) {
              const content = fs.readFileSync(report.filepath, 'utf8');
              const body = buildCommentBody(report.title, content);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body,
              });
            }
